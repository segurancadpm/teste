<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>DPM Solutions | Gestão de EPIs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="styles.css?v=20260812-core">
    <link rel="stylesheet" href="styles-contrast.css?v=20260812-core">
    <link rel="stylesheet" href="logo.css?v=20260812-core">
    <link rel="stylesheet" href="logo-boot.css?v=20260812-core">
    <link rel="stylesheet" href="desktop-responsive.css?v=20260812-core">
    <link rel="stylesheet" href="budget-management.css?v=20260812-sap">
    <link rel="stylesheet" href="budget-dashboard-visuals.css?v=20260812-v1">
    <link rel="stylesheet" href="inventory-general-layout.css?v=20260812-inventory">
    <style>.budget-management-root[data-cost-loading="1"] .budget-view{visibility:hidden}.family-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.family-tabs .active{background:var(--accent,#0f86b7);color:#fff}</style>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <script>
      window.addEventListener('error',e=>{console.error('DPM boot/runtime error:',e.error||e.message)});
      window.addEventListener('unhandledrejection',e=>console.error('DPM async error:',e.reason));
      import('./delivery-final.js?v=20260814-core-delivery-2')
        .then(()=>import('./app.js?v=20260814-core-delivery-2'))
        .then(()=>import('./budget-management-clean.js?v=20260812-sap'))
        .then(()=>import('./inventory-loader.js?v=20260812-safe-loader'))
        .then(()=>import('./warehouse-ui-v2.js?v=20260812-family-models'))
        .catch(err=>{console.error('DPM boot error:',err);const app=document.getElementById('app');if(app)app.innerHTML='<section style="padding:24px;font-family:system-ui"><h2>Erro ao iniciar a aplicação</h2><pre style="white-space:pre-wrap">'+String(err?.stack||err?.message||err).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre></section>'});
    </script>
  </body>
</html>
