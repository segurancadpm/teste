<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>DPM Solutions | Gestão de EPIs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="styles.css?v=20260812-core">
    <link rel="stylesheet" href="styles-contrast.css?v=20260812-core">
    <link rel="stylesheet" href="logo.css?v=20260812-core">
    <link rel="stylesheet" href="logo-boot.css?v=20260812-core">
    <link rel="stylesheet" href="desktop-responsive.css?v=20260812-core">
    <link rel="stylesheet" href="budget-management.css?v=20260812-sap">
    <link rel="stylesheet" href="budget-dashboard-visuals.css?v=20260812-v1">
    <link rel="stylesheet" href="inventory-general-layout.css?v=20260812-inventory">
    <style>.budget-management-root[data-cost-loading="1"] .budget-view{visibility:hidden}.family-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.family-tabs .active{background:var(--accent,#0f86b7);color:#fff}</style>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <script>
      window.addEventListener('error',e=>{if(e.error)showBootError(e.error)});
      window.addEventListener('unhandledrejection',e=>console.error('Erro assíncrono:',e.reason));
      function showBootError(error){const app=document.getElementById('app');if(!app||app.dataset.bootError==='1')return;app.dataset.bootError='1';const message=String(error?.message||error||'Erro desconhecido');app.innerHTML=`<section style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;background:#101820;color:#eef7fb"><div style="width:min(100%,520px);padding:24px;border:1px solid #334653;border-radius:14px;background:#172532"><div class="boot-logo" aria-label="DPM Solutions"></div><h1 style="font-size:20px;margin:0 0 10px">A aplicação não conseguiu iniciar</h1><p style="color:#9fb5c1;line-height:1.5">A página foi carregada, mas ocorreu um erro ao iniciar a aplicação.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border-radius:8px;background:#0b1116;color:#ffb020;font-size:13px">${message.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre><button onclick="location.reload()" style="min-height:42px;border:0;border-radius:8px;padding:0 16px;background:#00a3e0;color:#00131d;font-weight:700;cursor:pointer">Recarregar aplicação</button></div></section>`}
      import('./app.js?v=20260812-core')
        .then(()=>import('./budget-management-clean.js?v=20260812-sap'))
        .then(()=>import('./inventory-loader.js?v=20260812-safe-loader'))
        .then(()=>import('./warehouse-ui-v2.js?v=20260812-family-models'))
        .then(()=>import('./warehouse-entry-interaction-fix.js?v=20260814-entry-fix'))
        .then(()=>import('./inventory-master-definitive-delete.js?v=20260814-defdelete'))
        .then(()=>import('./delivery-modal-responsive.js?v=20260814-size-fix'))
        .then(()=>import('./delivery-model-inline.js?v=20260814-inline-model'))
        .catch(showBootError);
    </script>
  </body>
</html>
