<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>DPM Solutions | Gestão de EPIs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="styles.css?v=20260807-logo2">
    <link rel="stylesheet" href="styles-contrast.css?v=20260807-logo2">
    <link rel="stylesheet" href="logo.css?v=20260807-logo2">
    <link rel="stylesheet" href="logo-boot.css?v=20260807-logo2">
    <link rel="stylesheet" href="desktop-responsive.css?v=20260811-1">
    <link rel="stylesheet" href="budget-management.css?v=20260811-clean1">
    <style>
      .budget-management-root[data-cost-loading="1"] .budget-view { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <script>
      window.addEventListener('error', (event) => {
        if (event.error) showBootError(event.error);
      });
      window.addEventListener('unhandledrejection', (event) => {
        // Os módulos secundários não podem bloquear a aplicação principal.
        console.error('Erro assíncrono:', event.reason);
      });

      function showBootError(error) {
        const app = document.getElementById('app');
        if (!app || app.dataset.bootError === '1') return;
        app.dataset.bootError = '1';
        const message = String(error?.message || error || 'Erro desconhecido');
        app.innerHTML = `<section style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;background:#101820;color:#eef7fb"><div style="width:min(100%,520px);padding:24px;border:1px solid #334653;border-radius:14px;background:#172532"><div class="boot-logo" aria-label="DPM Solutions"></div><h1 style="font-size:20px;margin:0 0 10px">A aplicação não conseguiu iniciar</h1><p style="color:#9fb5c1;line-height:1.5">A página foi carregada, mas ocorreu um erro ao iniciar a aplicação.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border-radius:8px;background:#0b1116;color:#ffb020;font-size:13px">${message.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre><button onclick="location.reload()" style="min-height:42px;border:0;border-radius:8px;padding:0 16px;background:#00a3e0;color:#00131d;font-weight:700;cursor:pointer">Recarregar aplicação</button></div></section>`;
      }

      // O módulo principal de Orçamento é carregado primeiro e de forma
      // independente. Nenhum catálogo, gráfico ou correção secundária pode
      // deixar a aba Compras presa em “A carregar...”.
      import('./app.js?v=20260811-core2')
        .then(() => import('./budget-management-clean.js?v=20260811-core3'))
        .catch(showBootError);

      // Módulos auxiliares são opcionais e não bloqueiam a aplicação.
      // Se algum deles falhar, o módulo principal continua funcional.
      const loadOptional = (file) => import(file).catch(error => {
        console.error(`Módulo auxiliar não carregado: ${file}`, error);
        return null;
      });

      Promise.resolve()
        .then(() => loadOptional('./catalog-family-management-v3.js?v=20260811-catalog4'))
        .then(() => loadOptional('./budget-cost-family-fix.js?v=20260811-family5'))
        .then(() => loadOptional('./budget-cost-final.js?v=20260811-costfinal2'));
    </script>
  </body>
</html>
