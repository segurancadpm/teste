name: Validar JavaScript e integridade do site

on:
  push:
    branches: [main, chore/senior-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            echo "A validar: $file"
            if ! node --check "$file"; then
              failed=1
            fi
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)
          exit "$failed"
      - name: Validar integridade do site
        run: node scripts/validate-site.mjs
