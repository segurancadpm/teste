name: Validar JavaScript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          set -e
          failed=0
          while IFS= read -r -d '' file; do
            echo "A validar: $file"
            if ! node --check "$file"; then
              failed=1
            fi
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)
          exit "$failed"
