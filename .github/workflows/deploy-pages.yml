name: Deploy Ambiente Teste

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar versão atual da main
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout versão atual da main
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Desativar processamento Jekyll
        run: touch .nojekyll

      - name: Validar ficheiros essenciais
        run: |
          set -e
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f styles-contrast.css
          test -f logo.css
          test -f return-epi.js
          test -f budget-enhancement.js
          test -f budget-ui.css
          test -f budget-2026-import.js
          echo "Ficheiros essenciais encontrados."

      - name: Preparar artefacto do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
