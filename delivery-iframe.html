<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrega de EPI</title><style>body{margin:0;background:#fff;color:#123;font:14px system-ui,Arial}.wrap{max-width:760px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:12px}.item{border:1px solid #d5dce2;border-radius:10px;padding:14px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.select,.input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b9c6cf;border-radius:7px;background:#fff}.info{background:#eef8fc;border:1px solid #b8e0ef;border-radius:7px;padding:9px;font-size:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.btn{border:0;border-radius:7px;padding:10px 15px;cursor:pointer}.primary{background:#079bd2;color:#fff;font-weight:700}.ghost{background:#eef1f3}.danger{background:#f5dddd;color:#8b1e1e}.sig{border:1px solid #bbb;border-radius:8px;width:100%;height:260px;touch-action:none;background:#fff}.summary{background:#f5f7f8;border-radius:8px;padding:12px;line-height:1.6}.error{color:#a51d2d;background:#fdebec;padding:9px;border-radius:7px;display:none}.muted{color:#667}.busy{opacity:.6;pointer-events:none}@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><div id="app"></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import {getFirestore,doc,getDoc,setDoc,collection,addDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const fb=initializeApp({apiKey:'AIzaSyAqt5RDygjfeQZ3zq8dYhEGbyIjg00Bbks',authDomain:'dpm-epi.firebaseapp.com',projectId:'dpm-epi',storageBucket:'dpm-epi.firebasestorage.app',messagingSenderId:'1043253642340',appId:'1:1043253642340:web:d3e0920050b8407f48cb71',measurementId:'G-VZK3WE1MDJ'}),db=getFirestore(fb),mainRef=doc(db,'appdata','dpm_epi_data_v1');
const qs=new URLSearchParams(location.search),workerId=qs.get('worker'),workerName=qs.get('name');let data=null,worker=null,phase='worker',payload=null,points=[];const app=document.querySelector('#app');
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();const money=v=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(v||0));const today=()=>new Date().toISOString().slice(0,10);const addMonths=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+Number(n||0));return x.toISOString().slice(0,10)};
function models(epi){return Array.isArray(data?.epiModels?.[epi])?data.epiModels[epi].filter(m=>m&&m.ativo!==false):[]}function stock(wh,epi,model){data.stocks=data.stocks||{};data.stocks[wh]=data.stocks[wh]||{};let r=data.stocks[wh][epi];if(typeof r==='number')r={loose:r,sizes:{},models:{}};if(!r||typeof r!=='object')r={loose:0,sizes:{},models:{}};r.loose=Number(r.loose||r.semTamanho||0);r.sizes=r.sizes||{};r.models=r.models||{};if(model){r.models[model]=r.models[model]||{loose:0,sizes:{}};r.models[model].loose=Number(r.models[model].loose||0);r.models[model].sizes=r.models[model].sizes||{};return r.models[model]}data.stocks[wh][epi]=r;return r}function sizes(wh,epi,model){const r=stock(wh,epi,model?.nome),configured=model?.tamanhos||[];return [...new Set([...configured,...Object.keys(r.sizes||{})].map(x=>String(x).trim().toUpperCase()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-PT',{numeric:true}))}function avail(wh,epi,model,size){const r=stock(wh,epi,model||undefined);return size?Number(r.sizes[String(size).toUpperCase()]||0):Number(r.loose||0)}
function row(){return `<section class="item"><div class="field"><label>Artigo</label><select class="select" data-x="epi">${(data.matriz||[]).map((e,i)=>`<option value="${esc(e.nome)}" ${i===0?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></div><div class="field"><label>Modelo</label><select class="select" data-x="model"></select></div><div class="row"><div class="field"><label>Tamanho</label><select class="select" data-x="size"><option value="">Sem tamanho</option></select></div><div class="field"><label>Quantidade</label><input class="input" data-x="qty" type="number" min="1" value="1"></div></div><div class="field"><label>Validade (meses)</label><input class="input" data-x="months" type="number" min="1" value="12"></div><div class="info" data-x="info"></div><div class="actions"><button class="btn danger" type="button" data-x="remove">Remover</button></div></section>`}function refresh(r){const epi=r.querySelector('[data-x="epi"]').value,ms=models(epi),sel=r.querySelector('[data-x="model"]'),old=sel.value;sel.innerHTML=ms.length?'<option value="">Selecionar modelo</option>'+ms.map(m=>`<option value="${esc(m.id)}">${esc(m.nome)}${m.preco?` · ${money(m.preco)}`:''}</option>`).join(''):'<option value="">Sem modelo configurado</option>';sel.disabled=!ms.length;if(ms.some(m=>m.id===old))sel.value=old;const m=ms.find(x=>x.id===sel.value),s=r.querySelector('[data-x="size"]'),oldS=s.value;s.innerHTML='<option value="">Sem tamanho</option>'+sizes(worker.delegacao,epi,m).map(x=>`<option value="${esc(x)}">${esc(x)} (${avail(worker.delegacao,epi,m?.nome||'',x)})</option>`).join('');if([...s.options].some(o=>o.value===oldS))s.value=oldS;r.querySelector('[data-x="info"]').textContent=m?`Modelo: ${m.nome} · ${money(m.preco||0)} · Tamanhos disponíveis acima.`:'Selecione um modelo para carregar os tamanhos.'}
function renderForm(){app.innerHTML=`<div class="head"><div><h2>Registar Entrega de EPI</h2><div class="muted">${esc(worker.nome)} · ${esc(worker.delegacao)}</div></div><button class="btn ghost" id="close">Fechar</button></div><div id="items">${row()}</div><div class="actions"><button class="btn ghost" id="add">+ EPI</button><button class="btn primary" id="continue">Continuar → Assinatura</button></div><div id="err" class="error"></div>`;document.querySelectorAll('#items section').forEach(refresh)}
function collect(){const items=[...document.querySelectorAll('#items section')].map(r=>{const epi=data.matriz.find(e=>e.nome===r.querySelector('[data-x="epi"]').value),m=models(epi?.nome).find(x=>x.id===r.querySelector('[data-x="model"]').value)||null,size=r.querySelector('[data-x="size"]').value,qty=Number(r.querySelector('[data-x="qty"]').value||0),months=Number(r.querySelector('[data-x="months"]').value||epi?.meses||12);return{epi,model:m,size,qty,validity:addMonths(new Date(),months)}}).filter(x=>x.epi&&x.qty>0);if(!items.length)throw Error('Adicione pelo menos uma entrega.');for(const i of items){if(models(i.epi.nome).length&&!i.model)throw Error(`Selecione o modelo de ${i.epi.nome}.`);if(i.size&&avail(worker.delegacao,i.epi.nome,i.model?.nome||'',i.size)<i.qty)throw Error(`Stock insuficiente: ${i.epi.nome} ${i.size}.`)}return{worker,warehouse:worker.delegacao,items,responsavel:qs.get('responsavel')||'SuperAdmin'}}
function signature(){const summary=payload.items.map(i=>`${esc(i.epi.nome)}${i.model?' · '+esc(i.model.nome):''}${i.size?' · Tam. '+esc(i.size):''} · Qtd ${i.qty}`).join('<br>');app.innerHTML=`<div class="head"><div><h2>${phase==='worker'?'Assinatura do Trabalhador':'Rubrica de Quem Entrega'}</h2><div class="muted">${esc(payload.worker.nome)}</div></div><button class="btn ghost" id="cancel">Cancelar</button></div><div class="summary">${summary}</div><p>${phase==='worker'?'Declaro ter recebido os EPIs indicados, em bom estado, comprometendo-me a utilizá-los corretamente.':'Confirmo a entrega dos EPIs ao trabalhador.'}</p><canvas class="sig" id="sig"></canvas><div class="actions"><button class="btn ghost" id="clear">Limpar</button><button class="btn ghost" id="nosign">Sem assinatura</button><button class="btn primary" id="next">${phase==='worker'?'Confirmar assinatura →':'Confirmar e Guardar'}</button></div>`;const c=document.querySelector('#sig'),ctx=c.getContext('2d'),ratio=Math.max(devicePixelRatio||1,1),b=c.getBoundingClientRect();c.width=b.width*ratio;c.height=b.height*ratio;ctx.scale(ratio,ratio);ctx.lineWidth=3;ctx.lineCap='round';let drawing=false,last=null;points=[];c.onpointerdown=e=>{drawing=true;const q=pt(e);last=q;points.push([q])};c.onpointermove=e=>{if(!drawing)return;const q=pt(e);points.at(-1).push(q);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q};c.onpointerup=()=>{drawing=false;last=null};function pt(e){const z=c.getBoundingClientRect();return{x:e.clientX-z.left,y:e.clientY-z.top}}document.querySelector('#clear').onclick=()=>{points=[];ctx.clearRect(0,0,c.width,c.height)};document.querySelector('#cancel').onclick=()=>parent.postMessage({type:'dpm-delivery-cancel'},location.origin);document.querySelector('#nosign').onclick=()=>next(true);document.querySelector('#next').onclick=()=>next(false);function next(no){if(!no&&!points.length){alert('Assine no campo ou escolha Sem assinatura.');return}if(phase==='worker'){payload.workerSig=no?null:points;phase='deliverer';signature()}else{payload.delivererSig=no?null:points;save(no)}}}
async function save(no){document.body.classList.add('busy');try{const batch='DEL-'+Date.now()+'-'+Math.random().toString(16).slice(2,8);await Promise.all(payload.items.map(i=>addDoc(collection(db,'deliveries'),{batch_id:batch,worker_id:payload.worker.id,worker_nome:payload.worker.nome,epi_type:i.epi.nome,model_id:i.model?.id||'',model_name:i.model?.nome||'',qtd:i.qty,tamanho:String(i.size||'').toUpperCase(),delivery_date:today(),validity_date:i.validity,unit_price:Number(i.model?.preco??i.epi.preco??0),total_cost:Number(i.qty)*Number(i.model?.preco??i.epi.preco??0),responsavel:payload.responsavel,sem_assinatura:!!no,signature_points_trabalhador:payload.workerSig||null,signature_points_entregador:payload.delivererSig||null,created_at:Date.now()})));data.eventos=Array.isArray(data.eventos)?data.eventos:[];for(const i of payload.items){const r=stock(payload.warehouse,i.epi.nome,i.model?.nome||'');if(i.size){const k=i.size.toUpperCase();r.sizes[k]=Math.max(0,Number(r.sizes[k]||0)-i.qty)}else r.loose=Math.max(0,Number(r.loose||0)-i.qty);data.eventos.push({id:'EVT-'+Date.now()+'-'+Math.random().toString(16).slice(2,8),idTrab:payload.worker.id,tipo:'ENTREGA',epi:i.epi.nome,modelo:i.model?.nome||'',modelo_id:i.model?.id||'',qtd:i.qty,tamanho:String(i.size||'').toUpperCase(),armazem:payload.warehouse,estado:'Entregue',statusAlerta:'ATIVO',validade:i.validity,responsavel:payload.responsavel,assinado:!no})}await setDoc(mainRef,{stocks:data.stocks,eventos:data.eventos},{merge:true});parent.postMessage({type:'dpm-delivery-saved'},location.origin)}catch(e){console.error(e);alert('Não foi possível guardar a entrega.\n\n'+(e.message||e))}finally{document.body.classList.remove('busy')}}
async function boot(){try{const s=await getDoc(mainRef);if(!s.exists())throw Error('Dados não encontrados.');data=s.data();worker=(data.trabalhadores||[]).find(w=>String(w.id)===String(workerId)||(workerName&&norm(w.nome)===norm(workerName)));if(!worker)throw Error('Trabalhador não encontrado.');renderForm()}catch(e){app.innerHTML=`<div class="error" style="display:block">${esc(e.message||e)}</div>`}}boot();app.addEventListener('change',e=>{const r=e.target.closest('section');if(r&&(e.target.dataset.x==='epi'||e.target.dataset.x==='model'))refresh(r)});app.addEventListener('click',e=>{const a=e.target.closest('[data-x]');if(a?.dataset.x==='remove'){const rs=document.querySelectorAll('#items section');if(rs.length>1)a.closest('section').remove();return}if(e.target.id==='add'){document.querySelector('#items').insertAdjacentHTML('beforeend',row());refresh(document.querySelector('#items section:last-child'));return}if(e.target.id==='continue'){try{payload=collect();phase='worker';signature()}catch(err){const x=document.querySelector('#err');x.textContent=err.message;x.style.display='block'}}if(e.target.id==='close')parent.postMessage({type:'dpm-delivery-cancel'},location.origin)});
</script></body></html>
